version: '3.9'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: iot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: iot-frontend
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: iot-backend
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto
    container_name: iot-mqtt
    user: root
    ports:
      - "1883:1883"
    env_file:
      - .env
    command: >
      sh -c "chown -R mosquitto:mosquitto /mosquitto/data &&
      mosquitto_passwd -b -c /mosquitto/data/passwords \"$$MQTT_USERNAME\" \"$$MQTT_PASSWORD\" &&
      chown mosquitto:mosquitto /mosquitto/data/passwords &&
      chmod 640 /mosquitto/data/passwords &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

volumes:
  sqlite_data:
  mosquitto_data:
